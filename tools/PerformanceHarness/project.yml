name: WhiskersPerformanceHarness
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  WhiskersPerformanceHarness:
    type: application
    platform: iOS
    sources:
      - path: HarnessApp.swift
      - path: ../../DailyWhiskers/Services/DailyContentProvider.swift
      - path: ../../DailyWhiskers/Models/DailyContent.swift
      - path: ../../DailyWhiskers/Views/DailyRitualCardView.swift
      - path: ../../DailyWhiskers/Assets.xcassets
        buildPhase: resources
      - path: ../../DailyWhiskers/Resources/daily_whiskers_content.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kenwidemon.dailywhiskers.performanceharness
        DEVELOPMENT_TEAM: HYU33CNQ69
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Whiskers Profiling
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  WhiskersPerformanceHarness:
    build:
      targets:
        WhiskersPerformanceHarness: all
    run:
      config: Release
    profile:
      config: Release
