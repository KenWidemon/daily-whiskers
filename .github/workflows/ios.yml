name: iOS CI
on:
  workflow_dispatch:
    inputs:
      cache_epoch:
        description: Exact frozen readiness commit SHA (not a cache key)
        type: string
        required: true
permissions:
  contents: read
jobs:
  simulator-readiness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/pr143-sim-readiness-20261121' && github.run_attempt == '1' && inputs.cache_epoch == github.sha
    runs-on: xcode-27
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SOURCE_SHA: ${{ github.sha }}
      TESTED_SHA: ${{ github.sha }}
      CI_SHARD_ID: simulator-readiness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Readiness only on one fresh simulator
        id: readiness
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 ci/probe-simulator-readiness.py readiness
      - name: Explicit owned-only cleanup
        if: ${{ always() && steps.readiness.outcome != 'skipped' }}
        timeout-minutes: 2
        run: python3 ci/probe-simulator-readiness.py cleanup
      - name: Independent simulator absence readback
        if: ${{ always() && steps.readiness.outcome != 'skipped' }}
        timeout-minutes: 1
        run: python3 ci/probe-simulator-readiness.py verify-absence
      - name: Upload sanitized readiness evidence
        if: ${{ always() && steps.readiness.outcome != 'skipped' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sim-readiness-${{ github.sha }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: build/sim-readiness/
