name: App-free iOS readiness probe

# Deliberate branch-local experiment in the already registered workflow.
# This branch is not an acceptance workflow and must not be merged as CI policy.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact reviewed readiness-probe commit SHA (40 lowercase hex characters)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-readiness-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness-probe:
    name: App-free exact-runtime readiness
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ci-readiness-probe-20261111' && github.run_attempt == 1
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # Normal-scheduling ceiling: 180 + 600 + 65 + 60 + 90 + 300 + 60 + 60
      # = 1,415 seconds (23m35s), leaving 85s below the 25m outer job ceiling.
      # These reserves are not a hard real-time guarantee on a stalled host.
      - name: Supervise app-free readiness (600s plus 65s shutdown reserve)
        id: probe
        timeout-minutes: 12
        run: python3 ci/readiness_probe.py run
      - name: Collect bounded host evidence (75s plus 15s shutdown)
        if: always()
        timeout-minutes: 2
        run: python3 ci/readiness_probe.py collect
      - name: Clean up only the verified owned UUID (45s plus 15s shutdown)
        id: cleanup
        if: always()
        timeout-minutes: 1
        run: python3 ci/readiness_probe.py cleanup
      - name: Preserve raw and interrupted evidence
        id: artifacts
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dw-readiness-probe/
          retention-days: 30
          if-no-files-found: error
      - name: Report readiness and uncertainty (never CI acceptance)
        if: always()
        timeout-minutes: 1
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: python3 ci/readiness_probe.py summary
