name: DIAGNOSTIC ONLY - owned synthetic process sampler smoke
# Disposable, never app acceptance. Reuses registered ios.yml workflow.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed disposable commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sampler-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  harness:
    if: github.ref == 'refs/heads/codex/ci-sampler-smoke-20261114' && github.run_attempt == 1
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source
        run: |
          mkdir -p preflight-identity
          git rev-parse HEAD > preflight-identity/checkout.txt
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > preflight-identity/expected.txt
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: One real sample of owned synthetic process
        timeout-minutes: 1
        run: python3 -B ci/sampler_smoke.py preflight-evidence
      - name: Retain evidence including failures
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sampler-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preflight-identity
            preflight-evidence
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
