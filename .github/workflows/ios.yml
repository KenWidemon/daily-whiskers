name: Focused toolbar comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolbar-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pair:
    name: Original Cards method (${{ matrix.arm }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [control, treatment]
    defaults:
      run:
        working-directory: source
    env:
      ARM: ${{ matrix.arm }}
      CI_SHARD_ID: ${{ matrix.arm }}
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SOURCE_SHA: ${{ matrix.arm == 'control' && '79ad54a19b398a8222e86f116a5e939b7f009553' || github.sha }}
      TESTED_SHA: ${{ matrix.arm == 'control' && '79ad54a19b398a8222e86f116a5e939b7f009553' || github.sha }}
    steps:
      - name: Start execution allowance before checkout
        working-directory: ${{ github.workspace }}
        run: |
          python3 -c 'import os,time; open(os.environ["GITHUB_ENV"], "a").write(f"PAIR_DEADLINE={time.time()+2700}\n")'
      - name: Checkout immutable experiment harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          path: harness
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout arm source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          path: source
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen sources and cold package policy
        timeout-minutes: 1
        run: python3 ../harness/ci/toolbar-pair/evidence.py provenance
      # Same established 45-minute execution allowance. The 60-minute job cap
      # also includes checkouts; final cleanup/readers/uploads have explicit caps.
      - name: Reserve evidence time
        run: |
          python3 -c 'import os,runpy,time; budget=runpy.run_path("ci/run-stage.py"); budget["initialize_budget"](float(os.environ["PAIR_DEADLINE"])-time.time())'
      - name: Prepare unchanged toolchain and simulator
        run: python3 ci/run-stage.py prepare bash ci/prepare-app.sh
      # No cache restore/save in either arm; keep fresh lock-pinned packages.
      - name: Resolve locked dependencies
        id: resolve
        run: |
          python3 ci/run-stage.py resolve xcodebuild -resolvePackageDependencies \
            -project DailyWhiskers.xcodeproj -scheme DailyWhiskers \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO
          cmp DailyWhiskers.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved "$RUNNER_TEMP/Package.resolved.expected"
      - name: Run original focused method once
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: python3 ci/run-stage.py ui bash ../harness/ci/toolbar-pair/run.sh
      - name: Clean up owned simulator
        if: always()
        timeout-minutes: 1
        run: python3 ci/simulator.py cleanup
      - name: Read result and independent cleanup evidence
        if: always()
        timeout-minutes: 2
        run: python3 ../harness/ci/toolbar-pair/evidence.py collect
      - name: Preserve raw evidence even on failure
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: toolbar-pair-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/build/ToolbarPair.xcresult
            source/build/*.json
            source/build/*.log
            source/build/*.txt
          retention-days: 30
          if-no-files-found: error
