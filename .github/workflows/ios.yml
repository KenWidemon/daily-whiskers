name: Bounded switch input comparison (not acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        input: [tap, press150]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned hosted toolchain
        run: |
          mkdir -p build
          git rev-parse HEAD > build/source.txt
          bash ci/prepare-app.sh
      - name: Select fixed input arm
        env:
          INPUT_ARM: ${{ matrix.input }}
        run: |
          python3 ci/input-comparison.py
          git diff -- DailyWhiskersUITests > build/input-arm.patch
          printf '%s\n' "$INPUT_ARM" > build/input-arm.txt
      - name: Resolve locked packages
        run: bash ci/test-app.sh resolve
      - name: Focused unchanged test assertions
        run: |
          set -o pipefail
          xcodebuild test -project DailyWhiskers.xcodeproj \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO -scheme DailyWhiskersInteraction -configuration Debug \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) CI_SMOKE_TESTING' \
            -only-testing:DailyWhiskersUITests/MischievousCardsTests/testStillnessLiveAndLargestTextPortraitLandscape \
            -only-testing:DailyWhiskersUITests/ReminderUITests/testPermissionRevocationRegrantAndExplicitDisable \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=arm64" \
            -derivedDataPath build/CaptureDerivedData -resultBundlePath build/Capture.xcresult \
            -parallel-testing-enabled NO -test-iterations 3 -test-repetition-relaunch-enabled YES 2>&1 | tee build/capture.log
      - name: Capture retained app diagnostics and test result
        if: always()
        run: |
          if [ -d build/Capture.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Capture.xcresult > build/summary.json || true
            xcrun xcresulttool get test-results tests --path build/Capture.xcresult > build/tests.json || true
          fi
      - name: Preserve diagnostics (not release evidence)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: input-comparison-${{ matrix.input }}
          path: |
            build/Capture.xcresult
            build/*.log
            build/*.json
            build/*.txt
            build/*.patch
          retention-days: 7
          if-no-files-found: error
      - name: Shut down isolated simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_ID:-}" ]; then xcrun simctl shutdown "$SIMULATOR_ID" || true; fi
