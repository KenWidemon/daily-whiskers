name: Bounded first-enable capture (not acceptance)
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Reviewed isolated diagnostic commit (full SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: diagnostic-switch-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
    steps:
      - name: Start total budget
        timeout-minutes: 1
        run: echo "CAPTURE_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit and build within cumulative twelve-minute preparation budget
        timeout-minutes: 12
        run: python3 ci/first-enable-capture.py prepare
      - name: At most 24 serial original first-enable prefixes; no retries
        timeout-minutes: 41
        run: python3 ci/first-enable-capture.py run --mode campaign
      - name: Preserve diagnostic evidence
        if: always()
        timeout-minutes: 5
        run: python3 ci/first-enable-capture.py collect
      - name: Upload diagnostic evidence (not acceptance)
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-enable-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/capture/*.json
            build/capture/*.log
            build/capture/campaign
          retention-days: 14
          if-no-files-found: error
      - name: Delete only the dedicated diagnostic simulator
        if: always()
        timeout-minutes: 2
        run: python3 ci/first-enable-capture.py cleanup
