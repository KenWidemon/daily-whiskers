name: iOS CI
on:
  workflow_dispatch:
    inputs:
      cache_epoch:
        description: Exact frozen diagnostic commit SHA (not a cache key)
        type: string
        required: true
permissions:
  contents: read
jobs:
  saved-menu-trace:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/pr143-saved-menu-build-first-20261121' && github.run_attempt == '1' && inputs.cache_epoch == github.sha
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SOURCE_SHA: ${{ github.sha }}
      TESTED_SHA: ${{ github.sha }}
      CI_SHARD_ID: saved-menu-trace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout and initialize execution budget
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 ci/run-stage.py init-budget 2700
      - name: Verify pinned toolchain and prepare simulator
        id: prepare
        run: python3 ci/run-stage.py prepare bash ci/prepare-app.sh
      - name: Confirm exclusively owned simulator
        run: |
          python3 -c 'import json,os; s=json.load(open("build/simulator.json")); assert s["ownership"]=="created" and s["readback_verified"] and s["simulator_id"]==os.environ["SIMULATOR_ID"]'
      - name: Resolve locked public Swift packages
        run: python3 ci/run-stage.py resolve bash ci/test-app.sh resolve
      - name: Build and run the single Saved Cards method
        run: python3 ci/run-stage.py saved-menu python3 ci/saved-menu-trace.py
      - name: Remove only the owned simulator
        if: ${{ always() && steps.prepare.outcome != 'skipped' }}
        timeout-minutes: 3
        run: python3 ci/saved-menu-trace.py cleanup
      - name: Independently confirm simulator absence and baseline
        if: ${{ always() && steps.prepare.outcome != 'skipped' }}
        timeout-minutes: 1
        run: python3 ci/saved-menu-trace.py verify-absence
      - name: Upload scoped diagnostic evidence
        if: ${{ always() && steps.prepare.outcome != 'skipped' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: saved-menu-trace-${{ github.sha }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/trace-evidence/
            build/toolchain.txt
            build/prepare-status.json
            build/resolve-status.json
            build/saved-menu-status.json
            build/simulator.json
            build/cleanup-status.json
            build/absence-status.json
