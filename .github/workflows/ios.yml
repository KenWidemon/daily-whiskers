name: Nonqualifying Reminder boundary diagnostic

on:
  workflow_dispatch:
    inputs:
      cache_epoch:
        description: 'Compatibility input; ignored by this diagnostic (no cache)'
        type: string
        default: v2
      approved_sha:
        description: 'Separately approved exact frozen diagnostic commit (40 lowercase hex characters)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  reminder-boundary:
    name: Nonqualifying Reminder boundary single attempt
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPROVED_SHA: ${{ inputs.approved_sha }}
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Assert dispatch identity and start nonresetting budget
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, time
          e = os.environ
          expected = {'GITHUB_REPOSITORY': 'KenWidemon/daily-whiskers',
                      'GITHUB_EVENT_NAME': 'workflow_dispatch',
                      'GITHUB_REF': 'refs/heads/codex/pr143-reminder-boundary-20261115',
                      'GITHUB_RUN_ATTEMPT': '1', 'RUNNER_ARCH': 'ARM64'}
          for key, value in expected.items():
              if e.get(key) != value:
                  raise SystemExit('Wrong ' + key)
          approved = e.get('APPROVED_SHA', '')
          if not re.fullmatch('[0-9a-f]{40}', approved) or approved != e.get('GITHUB_SHA'):
              raise SystemExit('Event/approved SHA mismatch')
          root = pathlib.Path(e['RUNNER_TEMP']) / 'reminder-boundary'
          root.mkdir(exist_ok=False)
          (root / 'budget.json').write_text(json.dumps({
              'started_monotonic': time.monotonic(), 'sha': approved,
              'run_id': e['GITHUB_RUN_ID'], 'attempt': e['GITHUB_RUN_ATTEMPT']}))
          PY
      - name: Check out exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run single bounded diagnostic and finalize evidence
        timeout-minutes: 55
        run: python3 ci/reminder_boundary.py execute
      - name: Check evidence upload eligibility
        if: always()
        id: evidence
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reminder-boundary'
          receipt = json.loads((root / 'budget.json').read_text())
          remaining = receipt['started_monotonic'] + 3600 - time.monotonic()
          allowed = (root / 'upload-eligible').is_file() and remaining >= 300
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('upload=' + str(allowed).lower() + '\n')
          if not allowed:
              raise SystemExit('Evidence upload unavailable or insufficient original job budget')
          PY
      - name: Upload nonqualifying evidence
        if: ${{ always() && steps.evidence.outputs.upload == 'true' }}
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: nonqualifying-reminder-boundary-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reminder-boundary/evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
