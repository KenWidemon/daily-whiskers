name: iOS CI

on:
  pull_request:
    branches: [main, codex/develop, release/rc, codex/dw-012-proof-base]
  push:
    branches: [main, codex/develop, release/rc]
  workflow_dispatch:
    inputs:
      cache_epoch:
        description: 'Cache namespace for reproducible cold/warm comparisons (same value for both runs)'
        type: string
        default: v1

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changes (unknown means full validation)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/policy.py classify

  checks:
    name: Documentation and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'
      - name: Lint workflows
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml
      - name: Test classification and gate policy
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Install locked documentation tools
        run: npm ci --ignore-scripts --prefix ci/checks
      - name: Test documentation checker
        run: npm test --prefix ci/checks
      - name: Check Markdown format and local links
        run: npm run check --prefix ci/checks

  build-and-test:
    name: Build and unit tests
    needs: classify
    if: needs.classify.outputs.mode == 'deliberate-skip'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify toolchain and prepare project
        run: |
          set -o pipefail
          mkdir -p build
          bash ci/prepare-app.sh 2>&1 | tee build/prepare.log
      - name: Restore SwiftPM dependencies
        id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-17F113-iphonesimulator-26.5-${{ hashFiles('DailyWhiskers.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ inputs.cache_epoch || 'v1' }}
      - name: Report cache state
        env:
          CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
        run: printf 'SwiftPM cache hit = %s\n' "$CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve locked dependencies, build and run unit tests
        run: bash ci/test-app.sh
      # GitHub isolates pull_request caches to refs/pull/<number>/merge. A PR
      # cannot populate the base branch's cache; shared caches are saved on pushes.
      - name: Save validated SwiftPM dependencies
        if: success() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild.log
            build/resolve.log
            build/prepare.log
            build/timings.md
          retention-days: 7
          if-no-files-found: ignore

  gate:
    name: CI Gate
    needs: [classify, checks, build-and-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Reject cancelled workflow
        if: cancelled()
        run: exit 1
      - name: Require every applicable result
        if: ${{ !cancelled() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 ci/policy.py gate
